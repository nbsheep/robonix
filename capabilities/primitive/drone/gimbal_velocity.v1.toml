[contract]
id      = "robonix/primitive/drone/gimbal_velocity"
version = "1"
kind    = "primitive"
idl     = "drone/srv/GimbalVelocity.srv"
description = "云台 3DOF 角速度向量：vpitch/vroll/vyaw 俯仰/横滚/偏航角速度（°/s），duration 持续秒数。当前实现按 角速度×时长 折算为角度增量，叠加到客户端跟踪的当前云台姿态后经 /api/gimbal 绝对角度下发（离散近似）；真正连续云台速度控制需 APK 新增 /api/gimbal/velocity（KeyGimbalSpeed）。"

[mode]
type = "rpc"
