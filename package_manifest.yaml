manifestVersion: 1

package:
  name: com.robonix.drone_bridge
  version: 1.0.0
  vendor: robonix
  description: DJI M3E 无人机桥接原语 — HTTP API 连接 RC Pro，飞控、遥测、视频流
  license: MulanPSL-2.0

build: bash scripts/build.sh

start: bash scripts/start.sh

stop: |
  pkill -TERM -f "[p]ython3 -m drone_bridge.driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[p]ython3 -m drone_bridge.driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/drone/driver
  - name: robonix/primitive/drone/takeoff
  - name: robonix/primitive/drone/land
  - name: robonix/primitive/drone/move_velocity
  - name: robonix/primitive/drone/rotate_velocity
  - name: robonix/primitive/drone/hover
  - name: robonix/primitive/drone/rth
  - name: robonix/primitive/drone/gimbal_velocity
  - name: robonix/primitive/drone/gimbal_reset
  - name: robonix/primitive/drone/camera_capture
  - name: robonix/primitive/drone/camera_video
  - name: robonix/primitive/drone/state

config:
  rc_pro_ip:
    description: RC Pro IP 地址 (运行 Drone_test APK)
    type: string
    default: 10.225.57.15
  rc_pro_port:
    description: RC Pro WebServer 端口
    type: integer
    default: 8080
